name: ErnosPlain CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build (release)
        run: cargo build --release

      - name: Run unit tests
        run: cargo test --release

      - name: Full test suite (run_tests.sh)
        run: ./run_tests.sh

      - name: Build the self-hosted compiler (epc)
        run: ./target/release/ernos epc.ep

      - name: Self-hosted parity + rejection suite
        run: bash tests/run_epc_parity.sh

      - name: Differential suite (ernos vs epc must agree)
        run: bash tests/run_differential.sh

      - name: Stdlib gate (no duplicate names, every module importable)
        run: bash tests/run_stdlib_gate.sh

      - name: 3-stage self-compilation fixpoint (gen2 == gen3)
        run: bash tests/run_fixpoint.sh

      - name: Clang-only bootstrap (no Rust) — build, fixpoint, freshness
        run: bash bootstrap/verify.sh

      - name: Flagship demo — both compilers, identical output
        run: |
          ./target/release/ernos examples/bakery.ep
          ./examples/bakery > /tmp/bakery_rust.out
          ./epc examples/bakery.ep
          ./examples/bakery > /tmp/bakery_epc.out
          diff /tmp/bakery_rust.out /tmp/bakery_epc.out
          echo "flagship output identical across compilers"

      - name: Run conformance tests
        run: |
          for f in conformance/test_*.ep; do
            echo "Compiling $f..."
            cargo run --release -- "$f" || continue
            base=$(basename "$f" .ep)
            expected="conformance/${base}.expected"
            if [ -f "$expected" ]; then
              echo "Running $base..."
              actual=$(./conformance/"$base" 2>&1)
              expected_content=$(cat "$expected")
              if [ "$actual" = "$expected_content" ]; then
                echo "✓ $base passed"
              else
                echo "✗ $base FAILED"
                echo "Expected: $expected_content"
                echo "Actual:   $actual"
                exit 1
              fi
            fi
          done

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Build (release)
        run: cargo build --release

      - name: Run unit tests
        run: cargo test --release

      - name: Full test suite (run_tests.sh)
        run: ./run_tests.sh

      - name: Build the self-hosted compiler (epc)
        run: ./target/release/ernos epc.ep

      - name: Self-hosted parity + rejection suite
        run: bash tests/run_epc_parity.sh

      - name: Differential suite (ernos vs epc must agree)
        run: bash tests/run_differential.sh

      - name: Stdlib gate (no duplicate names, every module importable)
        run: bash tests/run_stdlib_gate.sh

      - name: 3-stage self-compilation fixpoint (gen2 == gen3)
        run: bash tests/run_fixpoint.sh

      - name: Clang-only bootstrap (no Rust) — build, fixpoint, freshness
        run: bash bootstrap/verify.sh

      - name: Flagship demo — both compilers, identical output
        run: |
          ./target/release/ernos examples/bakery.ep
          ./examples/bakery > /tmp/bakery_rust.out
          ./epc examples/bakery.ep
          ./examples/bakery > /tmp/bakery_epc.out
          diff /tmp/bakery_rust.out /tmp/bakery_epc.out
          echo "flagship output identical across compilers"

      - name: Run conformance tests
        run: |
          for f in conformance/test_*.ep; do
            echo "Compiling $f..."
            cargo run --release -- "$f" || continue
            base=$(basename "$f" .ep)
            expected="conformance/${base}.expected"
            if [ -f "$expected" ]; then
              echo "Running $base..."
              actual=$(./conformance/"$base" 2>&1)
              expected_content=$(cat "$expected")
              if [ "$actual" = "$expected_content" ]; then
                echo "✓ $base passed"
              else
                echo "✗ $base FAILED"
                echo "Expected: $expected_content"
                echo "Actual:   $actual"
                exit 1
              fi
            fi
          done
